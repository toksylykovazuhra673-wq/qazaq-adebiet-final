kind = "web"
previewPath = "/"
title = "QazaqAdebiet"
version = "1.0.0"
id = "artifacts/qazaq-adebiet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19906

[services.development]
run = "pnpm --filter @workspace/qazaq-adebiet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qazaq-adebiet", "run", "build" ]
serve = "static"
publicDir = "artifacts/qazaq-adebiet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19906"
BASE_PATH = "/"
